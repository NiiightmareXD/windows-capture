[package]
name = "windows-capture"
version = "2.0.1"
authors = ["NiiightmareXD"]
edition = "2024"
description = "Fastest Windows Screen Capture Library For Rust 🔥"
documentation = "https://docs.rs/windows-capture"
readme = "README.md"
repository = "https://github.com/NiiightmareXD/windows-capture"
license = "MIT"
keywords = ["screenshot", "screen", "capture", "graphics", "windows"]
categories = [
    "api-bindings",
    "graphics",
    "gui",
    "multimedia",
    "os::windows-apis",
]
resolver = "3"
exclude = ["tools/bindings/**"]

[dependencies]
# Focused Windows runtime support; API bindings are generated by tools/bindings.
windows-core = "0.100.0"
windows-collections = "0.100.0"
windows-future = "0.100.0"
windows-time = "0.100.0"

# Mutex optimization
parking_lot = "0.12.5"

# Multithreading
rayon = "1.12.0"

# Error handling
thiserror = "2.0.20"

[dev-dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc"]

[[example]]
name = "graphics_capture"
doc-scrape-examples = false

[[example]]
name = "dxgi_duplication"
doc-scrape-examples = false

[[example]]
name = "cli"
doc-scrape-examples = false

[[example]]
name = "stream_capture"
doc-scrape-examples = false

[workspace]
members = ["windows-capture-python"]
exclude = ["tools/bindings"]
